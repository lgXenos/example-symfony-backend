name: symfony-microservice-7

services:
  php:
    container_name: sm7-php-container
    user: www-data
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    volumes:
      - .:/var/www/microservice
    tty: true

  nginx:
    container_name: sm7-nginx-container
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "9090:80"
    volumes:
      - .:/var/www/microservice
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
